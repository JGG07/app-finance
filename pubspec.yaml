name: app_finance
description: App financiera personal para tomar control de gastos, presupuestos y metas.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.32.0
  drift_flutter: 0.3.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  app_settings: ^8.0.3

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: 2.33.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
